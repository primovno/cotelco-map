const KEY_LOCS = [{"lon": 125.22, "lat": 7.02, "name": "NGCP Mt. Apo SS", "dist": 0}, {"lon": 125.16, "lat": 7.015, "name": "Paco Junction"}, {"lon": 125.14, "lat": 7.16, "name": "Kidapawan City area"}, {"lon": 124.95, "lat": 7.075, "name": "Pres. Roxas Junction"}, {"lon": 124.9, "lat": 7.08, "name": "Matalam area"}, {"lon": 124.82, "lat": 6.94, "name": "Antipas area"}, {"lon": 124.8, "lat": 6.73, "name": "End of 69kV Line"}];
const CENTER = [7.055192, 124.988154];

const R = 6378137;
function haversineDist(lon1, lat1, lon2, lat2) {
    const dlon = (lon2 - lon1) * Math.PI / 180;
    const dlat = (lat2 - lat1) * Math.PI / 180;
    const a = Math.sin(dlat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dlon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function pointAtDistance(coords, distM) {
    let cum = 0;
    for (let j = 0; j < coords.length - 1; j++) {
        const d = haversineDist(coords[j][1], coords[j][0], coords[j+1][1], coords[j+1][0]);
        if (cum + d >= distM) {
            const frac = d > 0 ? (distM - cum) / d : 0;
            return [
                coords[j][0] + (coords[j+1][0] - coords[j][0]) * frac,
                coords[j][1] + (coords[j+1][1] - coords[j][1]) * frac
            ];
        }
        cum += d;
    }
    return coords[coords.length - 1];
}

// ── Open the located point in the device's native map ─────
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/i.test(navigator.userAgent);

function nativeMapUrl(lat, lon) {
    if (IS_IOS)    return 'https://maps.apple.com/?ll=' + lat + ',' + lon + '&q=' + lat.toFixed(5) + ',' + lon.toFixed(5);
    if (IS_ANDROID) return 'geo:' + lat + ',' + lon + '?q=' + lat + ',' + lon + '(Located%20Point)';
    return 'https://www.google.com/maps?q=' + lat + ',' + lon;
}

function nativeMapLabel() {
    if (IS_IOS)    return 'Open in Apple Maps';
    if (IS_ANDROID) return 'Open in Google Maps';
    return 'Open in Google Maps';
}

// ── Initialize map ────────────────────────────────────────
const map = L.map('map', {zoomControl: true}).setView(CENTER, 11);

// ── Tile providers with automatic fallback ────────────────
// Map reference: Google Satellite and Google Streets only.
const TILE_PROVIDERS = [
    {name: 'Google Satellite', url: 'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', attr: 'Google'},
    {name: 'Google Streets',   url: 'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', attr: 'Google'}
];
let tileLayer = null;
let tileIdx = 0;
let tileFailCount = 0;
let tileProviderTried = 0;

function setTileProvider(i) {
    i = i % TILE_PROVIDERS.length;
    if (tileLayer) map.removeLayer(tileLayer);
    tileIdx = i;
    tileFailCount = 0;
    const p = TILE_PROVIDERS[i];
    tileLayer = L.tileLayer(p.url, {maxZoom: 20, attribution: p.attr});
    tileLayer.on('tileerror', function() {
        tileFailCount++;
        if (tileFailCount >= 4 && tileProviderTried < TILE_PROVIDERS.length - 1) {
            tileProviderTried++;
            setTileProvider((tileIdx + 1) % TILE_PROVIDERS.length);
        }
    });
    tileLayer.addTo(map);
    const sel = document.getElementById('tileSel');
    if (sel) sel.value = i;
}

setTileProvider(0);

// ── Draw all background segments ───────────────────────────
for (const seg of SEGMENTS) {
    L.polyline(seg, {color: '#e94560', weight: 2, opacity: 0.4}).addTo(map);
}

// ── Route layer references ─────────────────────────────────
let routeLine = null;
let marker = null;
let circle = null;

function clearOverlays() {
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (marker) { map.removeLayer(marker); marker = null; }
    if (circle) { map.removeLayer(circle); circle = null; }
}

function locate() {
    clearOverlays();
    const ri = parseInt(document.getElementById('routeSel').value);
    const input = document.getElementById('distInput');
    const km = parseFloat(input.value.replace(/,/, '.')) || 0;
    const route = ROUTES[ri];
    const maxKm = route.len_km;
    const d = Math.max(0, Math.min(km, maxKm));
    const distM = Math.round(d * 1000);

    // Draw selected route
    routeLine = L.polyline(route.coords, {
        color: '#ff6b35', weight: 4, opacity: 0.9
    }).addTo(map);

    if (distM > 0) {
        const pt = pointAtDistance(route.coords, distM);
        const lat = pt[0], lon = pt[1];
        marker = L.marker([lat, lon], {icon: L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [0, -41]
        })}).addTo(map)
        .bindPopup(`<b>📍 ${(distM/1000).toFixed(2)} km</b><br>Route: ${route.label}<br>${lon.toFixed(5)}°E, ${lat.toFixed(5)}°N<br><a href="${nativeMapUrl(lat, lon)}" target="_blank" rel="noopener">${nativeMapLabel()}</a>`)
        .openPopup();

        circle = L.circleMarker([lat, lon], {
            radius: 8, color: '#ff6b35', fill: true, fillOpacity: 0.7
        }).addTo(map);

        map.setView([lat, lon], map.getZoom());
    }

    // Update URL hash so state is shareable/bookmarkable
    window.location.hash = `#${ri},${(distM/1000).toFixed(1)}`;
}

// ── Populate route selector ────────────────────────────────
const sel = document.getElementById('routeSel');
for (let i = 0; i < ROUTES.length; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = ROUTES[i].label + ' (' + ROUTES[i].len_km + ' km)';
    sel.appendChild(opt);
}

// ── Populate tile provider selector ────────────────────────
const tileSel = document.getElementById('tileSel');
for (let i = 0; i < TILE_PROVIDERS.length; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = TILE_PROVIDERS[i].name;
    tileSel.appendChild(opt);
}
tileSel.value = 0;

// ── Input events ───────────────────────────────────────────
document.getElementById('distInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') locate();
});

sel.addEventListener('change', function() {
    locate();
});

// ── Restore state from URL hash on load ────────────────────
function restoreFromHash() {
    const hash = window.location.hash.replace('#', '');
    if (!hash) return;
    const parts = hash.split(',');
    const ri = parseInt(parts[0]) || 0;
    const dk = parseFloat(parts[1]) || 0;
    if (ri < ROUTES.length) {
        sel.value = ri;
        document.getElementById('distInput').value = dk.toFixed(1);
        locate();
    }
}
restoreFromHash();
</script>
